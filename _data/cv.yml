    Experience:
      - company: aUToronto, University of Toronto Self-Driving Car Design Team
        position: Perception Software Developer, Tracking
        location: Toronto, ON
        start_date: 2024-09
        end_date: 2025-11
        highlights:
          - "Designed and implemented yaw-rate estimation in a C++/ROS 2 multi-sensor (lidar, camera) object tracker for the team's self-driving car, extending the Kalman filter state and its message interfaces"
          - "Built curve-based trajectory projection so the tracker could forecast turning obstacles for motion planning, extending message interfaces used by the prediction and planning subteams; tested via rosbag replay"

      - company: Learning Space Management, University of Toronto
        position: Tech2U Classroom Ambassador
        location: Toronto, ON
        start_date: 2024-09
        end_date: 2025-08
        highlights:
          - "Resolved audio-visual equipment faults on site as first point of contact for 600+ instructors across 290+ instructional spaces, triaging remotely dispatched service calls under live-class pressure; earned a Certificate of Special Recognition"
          - "Explained technical steps to non-technical faculty during live classes, performed preventive maintenance on classroom equipment, and worked with senior staff to standardize support procedures across campus"

      - company: Fuel Cell Lab, National Chung-Cheng University
        position: Research Assistant
        location: Taiwan
        start_date: 2022-09
        end_date: 2024-05
        highlights:
          - "Designed parametric experiments on a 25 cm² anion exchange membrane water electrolyzer, varying diffusion layers, catalyst loadings, and temperature to reach 600 mA/cm² at 1.8 V (~82% HHV voltage efficiency)"
          - "Engineered a hybrid hydrophilic/hydrophobic cathode gas diffusion layer by heat-treating carbon paper and spray-coating a carbon nanotube/PTFE layer, raising electrolyzer current density by 68.4% at 2 V"
          - "Developed a Python instrument-control and data-logging program that automated measurement runs on the lab's electrolyzer test station, replacing commercial software and saving over USD $1,000"
          - "First-authored an [SSRN preprint](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5082120) (2025) on a NiFe-LDH anode for AEM water electrolysis, integrating a catalyst supplied by collaborators at National Chung Hsing University into cell-level testing"

      - company: Chenbro Micom × Syntec Technology (Chenbro-Syntec Automation Competition)
        position: Industry-Academia Program Intern
        location: Taiwan
        start_date: 2022-07
        end_date: 2022-08
        highlights:
          - "Gathered requirements from Chenbro Micom staff and led a team of 5 to deliver a part-level traceability prototype cell for the server-chassis manufacturer, presenting the working cell to industry judges and winning 2nd place"
          - "Programmed PLC ladder logic and structured text on a Syntec controller to sequence a 6-DOF robot arm, vision-based part identification, and laser QR-code marking as one automated traceability cell; calibrated the camera with a checkerboard"
          - "Built a zero-cost Python service that polls PLC alarm data over Modbus and pushes real-time alerts to engineers' phones through LINE, so cell alarms could be diagnosed faster on site"

    Projects:
      - name: 5-inch FPV Quadcopter Build & Embedded Sensing (Self-Directed)
        start_date: 2026-07
        end_date: present
        highlights:
          - "Building a 6S LiPo 5-inch FPV quadcopter from components (F405 flight controller, 60A 4-in-1 ESC, 2207 1850KV motors, ELRS receiver, analog VTX), soldering ESC power and motor leads, wiring UART peripherals, and configuring Betaflight"
          - "Wrote bare-metal STM32F411 firmware in C (HAL) that reads an MPU-6050 IMU and a QMC5883P magnetometer over I2C and streams UART telemetry, to learn the sensor layer beneath a flight controller"

      - name: Vision-Based Drone Interceptor (M.Eng Capstone)
        start_date: 2026-01
        end_date: 2026-06
        highlights:
          - "Designed a stereo-depth perception front-end in a gravity-aligned frame, decoupling attitude error from range estimation for a maneuvering aerial target"
          - "Integrated YOLO detection, an LTV Kalman filter with rollback-update-rollforward for delayed measurement fusion, and Proportional Navigation guidance law into a single C++/ROS 2 pipeline"
          - "Achieved 99.1% detection mAP@50 and 0.99 m terminal miss distance in Flightmare/Gazebo simulation"

      - name: Computational Optimization
        start_date: 2026-01
        end_date: 2026-04
        highlights:
          - "Implemented particle swarm optimization to solve Keane's bump function up to n=50, the Brachistochrone problem, and a damped-oscillator parameter identification problem"
          - "Implemented steepest descent, BFGS quasi-Newton, and Barzilai-Borwein methods with a backtracking Armijo line search, benchmarking convergence across 10-trial runs on convex quadratic and Rosenbrock problems"
          - "Built a memetic PSO-SLSQP hybrid with event-driven local refinement, and compared mini-batch SGD, SGD with momentum, and nonlinear conjugate gradient on an airfoil surrogate-model regression task"

      - name: Efficient YOLO11 Object Detection for UAV Surveillance
        start_date: 2025-09
        end_date: 2025-12
        highlights:
          - "Improved YOLO11n mAP@50-95 by 13% on the VisDrone aerial dataset by adding a high-resolution P2 detection head, pruning the coarse P5 head, and redesigning loss functions for small, imbalanced targets"
          - "Integrated Inner-IoU regression loss and IOF-base10 logarithmic class reweighting to stabilize small object localization under a long-tail class distribution"
          - "Applied INT8 quantization with OpenVINO and TensorRT, reducing CPU inference latency by 51% with mAP@50-95 dropping from 0.176 to 0.169"

      - name: Gait Generation for an Underactuated Biped Robot
        start_date: 2025-09
        end_date: 2025-12
        highlights:
          - "Derived rigid-body dynamics and contact-impact maps from scratch for 2-link and 5-link planar bipeds, simulating event-driven contact-mode switching in MATLAB"
          - "Formulated gait synthesis as constrained trajectory optimization under dynamics, clearance, and orbital-stability constraints, solved with SQP (fmincon)"
          - "Replaced dense-grid clearance constraints with linear bounds on Bezier control points after diagnosing solver non-convergence at a kinematic singularity"
          - "Stabilized the generated gait on an underactuated plant (2 DOF, single actuator) via input-output feedback linearization over 25 consecutive steps"

      - name: Production Scheduling & Operations Optimization
        start_date: 2025-05
        end_date: 2025-08
        highlights:
          - "Formulated a 4-quarter production and workforce scheduling problem as a 13-variable linear program in MATLAB, with demand, capacity, inventory-balance, and rotating-shift constraints; minimized labor and holding cost to $495K with a 13-worker plan"
          - "Modeled multi-stage routing as a network-flow LP with segment capacity and flow-conservation constraints, determining maximum throughput of 5 units/day across 3 parallel paths"
          - "Applied simplex, duality, and sensitivity analysis to evaluate how capacity and resource changes shift the optimal operating plan"

      - name: UAV Path Planning and Autonomy
        start_date: 2025-01
        end_date: 2025-04
        highlights:
          - "Designed RRT*-based UAV path planning with smoothed waypoint navigation and curvature-based velocity profiling for a course-wide planning challenge"
          - "Implemented and tuned position and attitude control loops for quadrotor trajectory tracking in simulation"
          - "Developed a visual odometry pipeline on the KITTI dataset for ego-motion estimation"

      - name: Mobile Robot Mapping & Localization (TurtleBot)
        start_date: 2025-01
        end_date: 2025-04
        highlights:
          - "Implemented occupancy grid mapping, particle filter localization, and motion planning modules in ROS for a TurtleBot mobile robot; tested them in Gazebo, then ran 2D SLAM on the physical robot"

      - name: Semantic Segmentation for Autonomous Cars in Urban Environments
        start_date: 2025-01
        end_date: 2025-04
        highlights:
          - "Built and trained a modified Mobile-Seed segmentation model in PyTorch/OpenMMLab with integrated GCA + DAFF modules and benchmarked compute vs. accuracy trade-offs"

      - name: State Estimation
        start_date: 2024-09
        end_date: 2024-12
        highlights:
          - "Performed 3D nonlinear state estimation on SE(3) via batch Gauss-Newton optimization using stereo camera and IMU data on a UAV"
          - "Implemented an Extended Kalman Filter (EKF) for 2D robot localization fusing wheel odometry with landmark measurements"

      - name: Quadruped Robot Design
        start_date: 2022-02
        end_date: 2022-06
        highlights:
          - "Led a team of 3 to design and build a walking 2-DOF quadruped robot that also raises its legs and squats, on a USD $100 budget"
          - "Modeled its components and simulated the leg mechanisms in SolidWorks before fabrication and assembly"

